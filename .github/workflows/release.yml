# NekoSportsWorldTool 自动发布
#
# 触发方式：
#   ① 推送 tag：  git tag v0.2.0 && git push origin v0.2.0
#   ② 手动：     Actions 页面 Run workflow（仅出构建产物，不发布）。
#      mode=cli 时 Windows / macOS 也只编 CLI；Linux 产物始终是纯 CLI 构建
#      （与 src/update.rs 的资产约定一致：Linux GUI 自编译版不会自更新到 CLI 包）。
#
# 产物（资产名与 src/update.rs asset_name 精确对应，改名需同步）：
#   NekoSportsWorldTool-win-x64.zip            GUI + CLI
#   NekoSportsWorldTool-macos-arm64.tar.gz     GUI + CLI（Apple Silicon）
#   NekoSportsWorldTool-macos-x64.tar.gz       GUI + CLI（Intel，macOS runner 交叉编译）
#   NekoSportsWorldTool-linux-x64.tar.gz       纯 CLI（cross）
#   NekoSportsWorldTool-linux-aarch64.tar.gz   纯 CLI（cross）
#   NekoSportsWorldTool-macos-universal.zip    NekoSportsWorldTool.app（arm64 + x86_64，ad-hoc 签名；
#                                              仅供下载安装，自更新仍用上面两个 macOS tar.gz）
#   每个产物附带 <资产名>.sha256，自动更新下载后校验。
#
# Release 说明：开启 generate_release_notes，由 GitHub 按 commits / PR 自动生成
# What's Changed；多个 job（含 apk.yml）写同一个 Release 时以首个创建者为准。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: 构建模式（Linux 始终为 cli）
        type: choice
        default: full
        options: [full, cli]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            mode: full
            artifact: NekoSportsWorldTool-win-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            mode: full
            artifact: NekoSportsWorldTool-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            mode: full
            artifact: NekoSportsWorldTool-macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            mode: cli
            artifact: NekoSportsWorldTool-linux-x64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            mode: cli
            artifact: NekoSportsWorldTool-linux-aarch64
            cross: true
    runs-on: ${{ matrix.os }}
    env:
      # matrix 标记为 cli 的条目（Linux）不受手动输入影响；其余条目手动时可降为 cli
      MODE: ${{ matrix.mode == 'cli' && 'cli' || github.event.inputs.mode || matrix.mode }}
      TARGET: ${{ matrix.target }}
      ARTIFACT: ${{ matrix.artifact }}
      USE_CROSS: ${{ matrix.cross && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ env.MODE }}

      - name: Install cross (Linux 交叉编译)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          FEATURES=()
          if [ "$MODE" = "cli" ]; then FEATURES=(--no-default-features); fi
          # 带 cross 标记的条目无论何种模式都走 cross（宿主 cargo 无对应链接器）
          if [ "$USE_CROSS" = "true" ]; then CARGO=cross; else CARGO=cargo; fi
          echo "$CARGO build --locked --release --target $TARGET ${FEATURES[*]}"
          "$CARGO" build --locked --release --target "$TARGET" "${FEATURES[@]}"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/$TARGET/release/nekosportsworldtool
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="$BIN.exe"; fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            # 工具链自带 rust-objcopy 在部分版本上无法运行，profile 的 strip 可能静默失效
            strip -x "$BIN"
            codesign --force --sign - "$BIN"
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "dist/$ARTIFACT.zip" "$BIN"
          else
            tar czf "dist/$ARTIFACT.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi
          # 每个产物附带 <资产名>.sha256，自动更新下载后校验
          cd dist
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  macos-app:
    name: macOS universal .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Build arm64 + x86_64
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Bundle
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v[0-9]*) ;; *) VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" ;; esac
          scripts/macos-app.sh \
            target/aarch64-apple-darwin/release/nekosportsworldtool \
            target/x86_64-apple-darwin/release/nekosportsworldtool \
            "$VERSION" dist
          cd dist && shasum -a 256 NekoSportsWorldTool-macos-universal.zip > NekoSportsWorldTool-macos-universal.zip.sha256

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: NekoSportsWorldTool-macos-universal
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
