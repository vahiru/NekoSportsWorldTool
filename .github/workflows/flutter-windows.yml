name: Flutter Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-windows

      - name: Build Rust core (C ABI)
        run: cargo build --release --lib --no-default-features --features flutter

      - name: Flutter Windows release
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Stage core DLL and package
        shell: pwsh
        run: |
          $rel = "app/build/windows/x64/runner/Release"
          if (!(Test-Path "$rel/neko_sports.exe")) { throw "Flutter Windows output missing: $rel" }
          Copy-Item "target/release/nekosportsworldtool.dll" "$rel/" -Force
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$rel/*" -DestinationPath "dist/Neko-Motion-World-Flutter-windows-x64.zip" -Force
          Get-FileHash "dist/Neko-Motion-World-Flutter-windows-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Neko-Motion-World-Flutter-windows-x64.zip" } |
            Set-Content "dist/Neko-Motion-World-Flutter-windows-x64.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Neko-Motion-World-Flutter-windows-x64
          path: dist/*
