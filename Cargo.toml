[package]
name = "nekosportsworldtool"
version = "0.3.0"
edition = "2021"
description = "NekoSportsWorldTool：运动世界校园版协议自动化工具（GUI + CLI）"
license = "CC-BY-NC-4.0"
repository = "https://github.com/YanamiNeko/NekoSportsWorldTool"

[workspace]
members = [".", "crates/route-planner"]
resolver = "2"

[lib]
crate-type = ["rlib", "cdylib"]

[patch.crates-io]
# NativeActivity must release its event loop on Destroy and allow recreation.
winit = { path = "vendor/winit-0.30.13" }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd", "dep:winit"]
android = ["gui", "eframe/android-native-activity", "dep:android-activity", "dep:android_logger", "dep:jni", "dep:log", "dep:winit"]

[dependencies]
route-planner = { path = "crates/route-planner", features = ["serde"] }
# eframe 0.37 defaults to wgpu; keep the glow (OpenGL) renderer and the feature set 0.29 gave us
# (accesskit is added for desktop targets below: eframe rejects it with NativeActivity).
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "wayland", "x11"], optional = true }
egui = { version = "0.37", optional = true }
egui_extras = { version = "0.37", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Compact binary cache of parsed school road graphs.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
rsa = "0.9"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
rand_distr = "0.4"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit"], optional = true }
# rfd 无 Android 后端，仅在桌面目标编译（调用点 osm.rs 已按 cfg 门控）
rfd = { version = "0.17", optional = true }
ureq = { version = "2", default-features = false, features = ["native-certs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"

[target.'cfg(all(unix, not(any(target_os = "android", target_vendor = "apple"))))'.dependencies]
# eframe 0.37 no longer pulls winit's default features (0.29 did via glutin-winit):
# keep libwayland loaded via dlopen and client-side decorations on Linux/BSD.
winit = { version = "0.30", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"], optional = true }
android_logger = { version = "0.14", optional = true }
jni = { version = "0.21", optional = true }
log = { version = "0.4", optional = true }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
incremental = false
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
