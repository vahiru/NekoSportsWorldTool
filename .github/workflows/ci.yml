# NekoSportsWorldTool 持续集成：push / PR 时
#   - rustfmt 检查
#   - Linux 与 macOS 上 clippy（-D warnings）+ 测试，含默认 GUI 构建与 --no-default-features 纯 CLI 构建
#   - Android（aarch64-linux-android + android feature）clippy，挡住「桌面能编、安卓编不过」

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build deps (eframe / winit / rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libgtk-3-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (GUI + CLI)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (CLI only)
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings

      - name: Test (GUI + CLI)
        run: cargo test --workspace --locked

      - name: Test (CLI only)
        run: cargo test --workspace --locked --no-default-features

  android:
    name: android clippy
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-linux-android
      NDK_VERSION: 29.0.14206865   # 与 apk.yml 保持一致
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-clippy

      - name: 安装 NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null

      - name: Clippy (android feature, lib)
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/${TARGET}26-clang"
          export CC_aarch64_linux_android="$NDK_BIN/${TARGET}26-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo clippy --locked --target "$TARGET" --features android --lib -- -D warnings
